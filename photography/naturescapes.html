  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const cards = document.querySelectorAll(".photo-card");
      
      cards.forEach(card => {
        const fullImageUrl = card.getAttribute('onclick').match(/'([^']+)'/)[1];
        const photoImage = card.querySelector('.photo-image');
        
        // Start with inline style for a solid color or pattern
        photoImage.style.backgroundColor = "#f0f0f0";
        
        // Create a new image to preload
        const img = new Image();
        img.src = fullImageUrl;
        
        img.onload = function() {
          // Fade in effect
          photoImage.style.transition = "background-image 0.5s ease-in-out";
          photoImage.style.backgroundImage = `url(${fullImageUrl})`;
        };
      });
    });
  </script>
