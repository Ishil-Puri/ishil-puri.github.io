<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A collection of small things made with care.">
    <title>delight — ishil puri</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="intro">
      <h1>delight</h1>
      <p>little things, made with care</p>
      <a class="send-moment" href="mailto:ishil@berkeley.edu?subject=A%20delightful%20moment&amp;body=Here%20is%20a%20delightful%20moment%3A%0A%0A">contribute a delightful moment</a>
    </header>

    <main class="field" aria-label="A collection of delightful product moments">
      <figure class="moment moment--portrait" tabindex="0" data-index="1" aria-label="Delight 1 of 10: A tiny card reader — Airbnb">
        <video muted loop playsinline preload="none" poster="assets/tiny-destination-poster.png" data-src="assets/tiny-destination.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">01</span><strong class="caption-title">a tiny card reader</strong></span>
          <span class="caption-description">The card and reader look like tiny toys, down to the vase beside them. I love that the animation recreates what I would do at a hotel desk.</span>
          <span class="caption-source">Airbnb</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="2" aria-label="Delight 2 of 10: From phone to laptop — WhatsApp">
        <video muted loop playsinline preload="none" poster="assets/linked-devices-poster.png" data-src="assets/linked-devices.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">02</span><strong class="caption-title">from phone to laptop</strong></span>
          <span class="caption-description">I can follow messages, reactions, emoji and voice notes from my phone to my laptop. The flapping screen makes the explanation feel playful.</span>
          <span class="caption-source">WhatsApp</span>
        </figcaption>
      </figure>

      <figure class="moment moment--portrait" tabindex="0" data-index="3" aria-label="Delight 3 of 10: Snow in the listing — Wander">
        <video muted loop playsinline preload="none" poster="assets/wander-poster.png" data-src="assets/wander.mp4"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">03</span><strong class="caption-title">snow in the listing</strong></span>
          <span class="caption-description">When I open the home preview, snow starts falling across the scene. For a moment, I can picture what it might feel like to stay there.</span>
          <span class="caption-source">Wander</span>
        </figcaption>
      </figure>

      <figure class="moment moment--square" tabindex="0" data-index="4" aria-label="Delight 4 of 10: While the kitchen works — Uber Eats">
        <video muted loop playsinline preload="none" poster="assets/uber-order-poster.png" data-src="assets/uber-order.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">04</span><strong class="caption-title">while the kitchen works</strong></span>
          <span class="caption-description">While I wait, cartons, groceries and a whisk keep moving at the bottom of the screen. I can see that my order is being worked on instead of staring at a static status.</span>
          <span class="caption-source">Uber Eats</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="5" aria-label="Delight 5 of 10: A clock that catches the light — iOS">
        <video muted loop playsinline preload="none" poster="assets/no-alarm-poster.png" data-src="assets/no-alarm.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">05</span><strong class="caption-title">a clock that catches the light</strong></span>
          <span class="caption-description">When I tilt my iPhone, the highlights and shadows on the lock-screen clock move with it. It looks like the numbers are catching the light around me.</span>
          <span class="caption-source">iOS</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="6" aria-label="Delight 6 of 10: The tag pops up — Airbnb">
        <video muted loop playsinline preload="none" poster="assets/airbnb-offer-poster.png" data-src="assets/airbnb-offer.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">06</span><strong class="caption-title">the tag pops up</strong></span>
          <span class="caption-description">I just love the little 3D luggage tag that moves as the $50-off offer slides up.</span>
          <span class="caption-source">Airbnb</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="7" aria-label="Delight 7 of 10: The icons twirl in — Airbnb">
        <video muted loop playsinline preload="none" poster="assets/airbnb-experiences-poster.png" data-src="assets/airbnb-experiences.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">07</span><strong class="caption-title">the icons twirl in</strong></span>
          <span class="caption-description">The little home and hot-air balloon feel like glimpses of places I could actually go. I love that each 3D illustration turns once when Airbnb opens.</span>
          <span class="caption-source">Airbnb</span>
        </figcaption>
      </figure>

      <figure class="moment moment--portrait" tabindex="0" data-index="8" aria-label="Delight 8 of 10: A burger and a grocery bag — Rappi">
        <video muted loop playsinline preload="none" poster="assets/rappi-poster.png" data-src="assets/rappi.mp4"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">08</span><strong class="caption-title">a burger and a grocery bag</strong></span>
          <span class="caption-description">I love how the burger and overstuffed grocery bag look like toys I could pick up.</span>
          <span class="caption-source">Rappi</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="9" aria-label="Delight 9 of 10: Even the installer — Notion">
        <img src="assets/notion-installer.png" alt="Notion's drag-to-Applications installer" loading="lazy">
        <figcaption>
          <span class="caption-heading"><span class="caption-number">09</span><strong class="caption-title">even the installer</strong></span>
          <span class="caption-description">Notion redraws the standard drag-to-Applications arrow by hand. It makes me giddy. Who even does this?!</span>
          <span class="caption-source">Notion</span>
        </figcaption>
      </figure>

      <figure class="moment moment--portrait" tabindex="0" data-index="10" aria-label="Delight 10 of 10: The car is the marker — Waymo">
        <img src="assets/maps-home.jpeg" alt="A map route with a car waiting at a traffic light" loading="lazy">
        <figcaption>
          <span class="caption-heading"><span class="caption-number">10</span><strong class="caption-title">the car is the marker</strong></span>
          <span class="caption-description">The car icon is right there at the same red light as the real car. It's like I can see what's happening outside!</span>
          <span class="caption-source">Waymo</span>
        </figcaption>
      </figure>
    </main>

    <aside class="detail" aria-live="polite" aria-atomic="true">
      <p class="detail-number"></p>
      <h2 class="detail-title"></h2>
      <p class="detail-description"></p>
      <p class="detail-source"></p>
    </aside>

    <p class="hint" aria-hidden="true">move slowly · drag gently · click to hold</p>

  </body>
</html>
