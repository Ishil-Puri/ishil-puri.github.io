<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A collection of small things made with care.">
    <title>delight — ishil puri</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="intro">
      <h1>delight</h1>
      <p>little things, made with care</p>
    </header>

    <main class="field" aria-label="A collection of delightful product moments">
      <figure class="moment moment--portrait" tabindex="0" data-index="1" aria-label="Delight 1 of 10: Payment, made physical — Airbnb">
        <video muted loop playsinline preload="none" poster="assets/tiny-destination-poster.png" data-src="assets/tiny-destination.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">01</span><strong class="caption-title">payment, made physical</strong></span>
          <span class="caption-description">A tiny 3D card slips into a reader beside a vase, then swoops back out once approved—turning a generic payment wait into a physical moment.</span>
          <span class="caption-source">Airbnb</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="2" aria-label="Delight 2 of 10: Linked, visibly — WhatsApp">
        <video muted loop playsinline preload="none" poster="assets/linked-devices-poster.png" data-src="assets/linked-devices.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">02</span><strong class="caption-title">linked, visibly</strong></span>
          <span class="caption-description">The animation explains the system without a word: messages, reactions, emoji and voice notes travel from your phone to your laptop.</span>
          <span class="caption-source">WhatsApp</span>
        </figcaption>
      </figure>

      <figure class="moment moment--portrait" tabindex="0" data-index="3" aria-label="Delight 3 of 10: Snow in the preview — Wander">
        <video muted loop playsinline preload="none" poster="assets/wander-poster.png" data-src="assets/wander.mp4"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">03</span><strong class="caption-title">snow in the preview</strong></span>
          <span class="caption-description">Even the property preview is alive. Open the house and snow falls gently across the scene outside.</span>
          <span class="caption-source">Wander</span>
        </figcaption>
      </figure>

      <figure class="moment moment--square" tabindex="0" data-index="4" aria-label="Delight 4 of 10: Waiting, animated — Uber Eats">
        <video muted loop playsinline preload="none" poster="assets/uber-order-poster.png" data-src="assets/uber-order.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">04</span><strong class="caption-title">waiting, animated</strong></span>
          <span class="caption-description">Cartons, groceries and a whisk animate while the order is prepared, making the waiting state feel active rather than empty.</span>
          <span class="caption-source">Uber Eats</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="5" aria-label="Delight 5 of 10: A clock that catches the light — iOS">
        <video muted loop playsinline preload="none" poster="assets/no-alarm-poster.png" data-src="assets/no-alarm.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">05</span><strong class="caption-title">a clock that catches the light</strong></span>
          <span class="caption-description">As the phone moves, the clock’s Liquid Glass highlights and shadows shift with it, making the lock screen feel physically lit.</span>
          <span class="caption-source">iOS</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="6" aria-label="Delight 6 of 10: An offer with an entrance — Airbnb">
        <video muted loop playsinline preload="none" poster="assets/airbnb-offer-poster.png" data-src="assets/airbnb-offer.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">06</span><strong class="caption-title">an offer with an entrance</strong></span>
          <span class="caption-description">A discount could have been a plain banner. The animated luggage tag gives the offer a satisfying little entrance.</span>
          <span class="caption-source">Airbnb</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="7" aria-label="Delight 7 of 10: Three little twirls — Airbnb">
        <video muted loop playsinline preload="none" poster="assets/airbnb-experiences-poster.png" data-src="assets/airbnb-experiences.mov"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">07</span><strong class="caption-title">three little twirls</strong></span>
          <span class="caption-description">On launch, beautifully modeled 3D icons for Homes, Experiences and Services greet you with a small twirl.</span>
          <span class="caption-source">Airbnb</span>
        </figcaption>
      </figure>

      <figure class="moment moment--portrait" tabindex="0" data-index="8" aria-label="Delight 8 of 10: A tiny arrival — Rappi">
        <video muted loop playsinline preload="none" poster="assets/rappi-poster.png" data-src="assets/rappi.mp4"></video>
        <figcaption>
          <span class="caption-heading"><span class="caption-number">08</span><strong class="caption-title">a tiny arrival</strong></span>
          <span class="caption-description">A small animated opening gives even a brief loading state a sense of arrival.</span>
          <span class="caption-source">Rappi</span>
        </figcaption>
      </figure>

      <figure class="moment moment--landscape" tabindex="0" data-index="9" aria-label="Delight 9 of 10: Even the installer — Notion">
        <img src="assets/notion-installer.png" alt="Notion's drag-to-Applications installer" loading="lazy">
        <figcaption>
          <span class="caption-heading"><span class="caption-number">09</span><strong class="caption-title">even the installer</strong></span>
          <span class="caption-description">A hand-drawn arrow turns the most generic Mac installer instruction into something unmistakably Notion.</span>
          <span class="caption-source">Notion</span>
        </figcaption>
      </figure>

      <figure class="moment moment--portrait" tabindex="0" data-index="10" aria-label="Delight 10 of 10: The car is the marker — Waymo">
        <img src="assets/maps-home.jpeg" alt="A map route with a car waiting at a traffic light" loading="lazy">
        <figcaption>
          <span class="caption-heading"><span class="caption-number">10</span><strong class="caption-title">the car is the marker</strong></span>
          <span class="caption-description">The map uses the actual car as its icon, making your position feel more concrete than a generic location marker.</span>
          <span class="caption-source">Waymo</span>
        </figcaption>
      </figure>
    </main>

    <aside class="detail" aria-live="polite" aria-atomic="true">
      <p class="detail-number"></p>
      <h2 class="detail-title"></h2>
      <p class="detail-description"></p>
      <p class="detail-source"></p>
    </aside>

    <p class="hint" aria-hidden="true">move slowly · drag gently · click to hold</p>
    <noscript><p class="noscript">Turn on JavaScript to play the recordings.</p></noscript>
  </body>
</html>
