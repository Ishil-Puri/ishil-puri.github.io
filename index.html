		<script>
			//smooth scroll
			$(document).ready(function () {
				$("a").on('click', function (event) {
					if (this.hash !== "") {
						event.preventDefault();
						var hash = this.hash;
						$('html, body').animate({
							scrollTop: $(hash).offset().top
						}, 700, function () {
							window.location.hash = hash;
						});
					}
				});
			});

			var long_lived_token = "IGQVJXcFNnaUp3bU12UC1mY3FEREszNnpZAY3dzdG5Xb1FpajYyOGpvdVkxNWltU1lGZAkNRcURyNF9nb0h6TUlfN2ljazZAhbU9mUnM5NEpaOWRyMl9WakxqR3pic1NSSUEwSEV0T1BOWEJSbFE0X05NUVhEYUVwYk85dGc0";

			function setURL(url) {
				var params = new URLSearchParams(URL);
				params.append("fields", "access_token");
				params.set("fields", "id,media_type,media_url,timestamp,caption");
				params.set("access_token", long_lived_token);
				return (url + params.toString());
			}
 
			function carouselSetup(media) {
				var album = document.getElementById('insta');
				var count = 0;
				media['data'].forEach(elem => {
					newItem = document.createElement('a');
					newItem.classList.add('carousel-item');
					newItem.href = '#' + count;
						newPic = document.createElement('img');
						newPic.src = elem['media_url'];
						newPic.classList.add('carousel-img');
						
						newCap = document.createElement('div');
						newCap.innerHTML = elem['caption'];
						newCap.classList.add('caption-box');
					newItem.appendChild(newPic);
					newItem.appendChild(newCap);
					album.appendChild(newItem);
					count++;
				});
			}

			document.addEventListener('DOMContentLoaded', function () {
				console.log("Page loaded.");
				var url = setURL("https://graph.instagram.com/me/media?");
				fetch(url)
					.then((response) => {
						return response.json();
					})
					.then((data) => {
						console.log("request data: ",data);
						carouselSetup(data);
					});
				// toggle('about');
				// toggle('insta');
			});

			function toggle(id) {
				var x = document.getElementById(id);
				if (x.style.display === "none") {
					x.style.display = "inline-block";
				} else {
					x.style.display = "none";
				}
			}
		</script>
